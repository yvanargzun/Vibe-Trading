# Synaptika Trade portal (Open WebUI + Ops) behind Caddy + DuckDNS
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./webui/boot.html:/srv/webui/boot.html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - open-webui
      - ops

  llm-proxy:
    build: ./llm_proxy
    restart: unless-stopped
    environment:
      - LLM_PROXY_MODEL=${LLM_PROXY_MODEL:-synaptika-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-gemma4:31b}
      # OpenRouter = last-resort (also accepts OPENAI_API_KEY OWUI naming)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://openrouter.ai/api/v1}
      # Free-only OpenRouter failover (set ALLOW_PAID_OPENROUTER=1 to re-enable paid IDs)
      - OPENROUTER_FAILOVER_MODELS=${OPENROUTER_FAILOVER_MODELS:-google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-nano-30b-a3b:free,nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-20b:free,inclusionai/ling-3.0-flash:free,google/gemma-3-27b-it:free,meta-llama/llama-3.3-70b-instruct:free,qwen/qwen-2.5-72b-instruct:free}
      - ALLOW_PAID_OPENROUTER=${ALLOW_PAID_OPENROUTER:-0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LLM_PROXY_429_ALERT_STREAK=${LLM_PROXY_429_ALERT_STREAK:-3}
    ports:
      - "127.0.0.1:4000:4000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - WEBUI_NAME=Synaptika Trade
      - WEBUI_URL=https://synaptika-trade.duckdns.org:8443
      # Auth via Ops → Caddy trusted headers (no second signup form)
      - WEBUI_AUTH=True
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-WebUI-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-WebUI-Name
      - WEBUI_AUTH_TRUSTED_ROLE_HEADER=X-WebUI-Role
      - ENABLE_SIGNUP=false
      - ENABLE_LOGIN_FORM=false
      - DEFAULT_USER_ROLE=admin
      - WEBUI_AUTH_COOKIE_SAME_SITE=none
      - WEBUI_AUTH_COOKIE_SECURE=true
      - WEBUI_SESSION_COOKIE_SAME_SITE=none
      - WEBUI_SESSION_COOKIE_SECURE=true
      - ENV=prod
      # Local Ollama API off; cloud + OpenRouter via llm-proxy failover
      - ENABLE_OLLAMA_API=false
      - ENABLE_EVALUATION_ARENA_MODELS=false
      # Primary = failover proxy (Gemini→Ollama→OpenRouter). Manual picks still available.
      - OPENAI_API_BASE_URL=http://llm-proxy:4000/v1
      - OPENAI_API_KEY=synaptika-proxy
      # Real OpenRouter key (from secrets) for manual model picker + apply scripts
      - OPENAI_UPSTREAM_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_UPSTREAM_BASE_URL=${OPENAI_API_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_BASE_URLS=http://llm-proxy:4000/v1;${OPENAI_API_BASE_URL:-https://openrouter.ai/api/v1};${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OPENAI_API_KEYS=synaptika-proxy;${OPENAI_API_KEY:-};${OLLAMA_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-gemma4:31b}
      - LLM_PROXY_MODEL=${LLM_PROXY_MODEL:-synaptika-auto}
      - LLM_PROXY_BASE_URL=http://llm-proxy:4000/v1
      - OPS_API_KEY=${OPS_API_KEY:-}
      - OPS_TOOL_URL=http://ops:8787
      - OPS_TOOL_OPENAPI_PATH=/ops/api/openapi.json
      # Copiloto default hits proxy auto model
      - DEFAULT_MODELS=${LLM_PROXY_MODEL:-synaptika-auto}
      - COPILOT_MAX_TOKENS=${COPILOT_MAX_TOKENS:-3072}
      - DEFAULT_MODEL_PARAMS={"stream_response":false,"max_tokens":3072,"temperature":0.4,"function_calling":"native"}
      - ENABLE_REALTIME_CHAT_SAVE=true
      - CHAT_HISTORY_DIR=/data/chat_history
    volumes:
      - open_webui:/app/backend/data
      - ./chat_history:/data/chat_history
      - ./brand/logo-icon.png:/brand/logo-icon.png:ro
      - ./brand/logo-wordmark.png:/brand/logo-wordmark.png:ro
      - ./webui/free_models.json:/srv/webui/free_models.json:ro
      - ./webui/SYSTEM_PROMPT.md:/srv/webui/SYSTEM_PROMPT.md:ro
      - ./webui/ops_context_filter.py:/srv/webui/ops_context_filter.py:ro
      - ./webui/apply_free_models.py:/srv/webui/apply_free_models.py:ro
      - ./webui/apply_copilot.py:/srv/webui/apply_copilot.py:ro
      - ./webui/export_chat_history.py:/srv/webui/export_chat_history.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ops
      - llm-proxy

  ops:
    build: ./ops_panel
    restart: unless-stopped
    environment:
      - OPS_HOME=/data
      - VIBE_HOME=/data/vibe
      - ALPACA_HOME=/data/alpaca
      - ALPACA_SCALP15_HOME=/data/alpaca_scalp15
      - OPS_PASSWORD=${OPS_PASSWORD:-changeme}
      - OPS_SECRET=${OPS_SECRET:-synaptika-ops-secret}
      - OPS_API_KEY=${OPS_API_KEY:-}
      - CHAT_URL=${CHAT_URL:-https://synaptika-trade.duckdns.org:8443/__boot}
      - BRAND_NAME=Synaptika Trade
      - BRAND_DIR=/brand
      - CHAT_HISTORY_DIR=/data/chat_history
      - WEBUI_DB=/data/webui/webui.db
      - CHAT_PUBLIC_BASE=https://synaptika-trade.duckdns.org:8443
    volumes:
      - ./ops_panel/app.py:/app/app.py:ro
      - ./ops_panel/data.py:/app/data.py:ro
      - ./ops_panel/chat_history.py:/app/chat_history.py:ro
      - ./ops_panel/control.py:/app/control.py:ro
      - ./ops_panel/control_api.py:/app/control_api.py:ro
      - ./ops_panel/strategy_briefs.json:/app/strategy_briefs.json:ro
      - ./ops_panel/templates:/app/templates:ro
      - ./ops_panel/static:/app/static:ro
      - ./brand:/brand:ro
      - ./chat_history:/data/chat_history
      - open_webui:/data/webui:ro
      - /root/.vibe-trading:/data/vibe
      - /root/.alpaca-paper:/data/alpaca
      - /root/.alpaca-scalp15:/data/alpaca_scalp15
      - /root/synaptika-trade/ops_audit.jsonl:/data/ops_audit.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  caddy_data:
  caddy_config:
  open_webui:
